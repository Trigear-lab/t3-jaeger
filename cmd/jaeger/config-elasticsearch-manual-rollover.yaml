extensions:
  healthcheckv2:
    use_v2: true
    http:

  jaeger_query:
    storage:
      traces: some_storage
    ui:
      config_file: ./cmd/jaeger/config-ui.json

  jaeger_storage:
    backends:
      some_storage:
        elasticsearch:
          server_urls:
            - http://localhost:9200
          indices:
            index_prefix: "jaeger-mr"
            spans:
              shards: 1
              replicas: 0
              rotation:
                manual_rollover: {}
            services:
              shards: 1
              replicas: 0
              rotation:
                manual_rollover: {}
            dependencies:
              shards: 1
              replicas: 0
              rotation:
                manual_rollover: {}
            sampling:
              shards: 1
              replicas: 0
              rotation:
                manual_rollover: {}

